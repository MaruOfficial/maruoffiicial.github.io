<!DOCTYPE html>
<html>
<head>
  <title>My Hosting Form</title>
  <style>
    body {
      background-color: black;
      color: cyan;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    input[type="text"], input[type="file"] {
      margin: 10px;
      padding: 10px;
      width: 80%;
      border-radius: 5px;
    }
    .submit-btn {
      background-color: cyan;
      color: black;
      padding: 10px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>My Hosting Service</h1>
  
  <form action="#" method="POST" enctype="multipart/form-data">
    <input type="text" name="telegram" placeholder="Telegram Username" required><br>
    <input type="text" name="realname" placeholder="Real Name" required><br>
    <input type="text" name="plan" placeholder="Hosting Plan (e.g. Plan 100)" required><br>
    <input type="text" name="amount" placeholder="Amount Paid" required><br>

    <p>Upload Receipt (image):</p>
    <input type="file" name="receipt" accept="image/*" required><br>

    <p>Upload Hosting File:</p>
    <input type="file" name="hostingFile" required><br>

    <p>Upload Database (ZIP only):</p>
    <input type="file" name="database" accept=".zip" required><br>

    <button class="submit-btn" type="submit">Send All Files</button>
  </form>
</body>
</html>
